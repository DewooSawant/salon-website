# Docker Compose for Salon Website
# Usage: docker-compose up -d

version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: salon-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-glamour_salon}
      MYSQL_USER: ${DB_USER:-salon_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-salonpassword}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Backend API
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: salon-api
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-salon_user}
      DB_PASSWORD: ${DB_PASSWORD:-salonpassword}
      DB_NAME: ${DB_NAME:-glamour_salon}
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      SALON_WHATSAPP_NUMBER: ${SALON_WHATSAPP_NUMBER:-919876543210}
    ports:
      - "5000:5000"

  # Frontend (Nginx serving React build)
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: salon-frontend
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro

volumes:
  mysql_data:


